name: CI & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read
      - name: Archive Scan Reports (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-reports
          path: |
            results.sarif
            results.md

      - name: Upload SARIF to GitHub Code Scanning
        continue-on-error: true  # Don't fail the whole build if private repo lacks GHAS
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: authz-probe
